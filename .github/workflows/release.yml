name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vX.Y.Z.' >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "DMG_PATH=dist/WireGuard-Menu-${TAG#v}-universal.dmg" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          : "${BUILD_CERTIFICATE_BASE64:?Set the BUILD_CERTIFICATE_BASE64 repository secret}"
          : "${P12_PASSWORD:?Set the P12_PASSWORD repository secret}"
          certificate="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/^[[:space:]]*[0-9]+\) ([A-F0-9]{40}) "Developer ID Application:.*$/\1/p' | head -n 1)
          if [[ -z "$identity" ]]; then
            echo 'The certificate must be a valid Developer ID Application identity with its private key.' >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build universal app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash build.sh --arch arm64 --arch x86_64
          lipo 'dist/WireGuard Menu.app/Contents/MacOS/WireGuardMenu' -verify_arch arm64 x86_64
          lipo 'dist/WireGuard Menu.app/Contents/MacOS/WireGuardHelper' -verify_arch arm64 x86_64
      - name: Create and sign disk image
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto 'dist/WireGuard Menu.app' "$staging/WireGuard Menu.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname 'WireGuard Menu' -srcfolder "$staging" \
            -fs HFS+ -format UDZO "$DMG_PATH"
          codesign --sign "$SIGNING_IDENTITY" --timestamp "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          : "${APPLE_ID:?Set the APPLE_ID repository secret}"
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID repository secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Set the APPLE_APP_SPECIFIC_PASSWORD repository secret}"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG_PATH"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$DMG_PATH" --verify-tag --draft \
            --title "WireGuard Menu $VERSION" --generate-notes
      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/signing.p12"
